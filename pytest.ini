[pytest]
testpaths = tests
python_files = test_*.py
# tests/ 里的测试直接 `import karma` / `import store`（main.py 的顶层模块兜底分支要用
# 同一套导入路径）。不写这一条时，从仓库根跑 `py -m pytest astrbot_plugin_netherlink/tests`
# 会 ModuleNotFoundError——pytest 只把 rootdir（=本目录）加进 sys.path 的行为需要显式声明。
# 相对 rootdir 解析，pytest >= 7 支持。
pythonpath = .
