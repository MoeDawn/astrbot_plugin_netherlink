# NetherLink 结构化动作目录(默认值)
#
# 这是**给人改的**配置文件 —— 插件首次启动时会把它复制到
#   data/plugin_data/netherlink/actions.yaml
# 之后**只读那一份**(升级不覆盖).
#
# 用途:把"命令文本的生成"从 AI 移出.AI 只填参数,插件按 template 拼命令
# 并做校验.实现说明见 docs/structured-actions.md(在仓库根).
#
# 改完要**重启或热重载**插件才生效.目录里有格式错时插件启动会**响亮报错**,
# 不会静默跳过某一条.
#
# ---------------------------------------------------------------------------
# 字段说明
# ---------------------------------------------------------------------------
#   name      工具名(AI 看到的就是它).只允许小写字母/数字/下划线,字母开头.
#             不要用 mc_command / mc_karma(与既有工具撞名).
#   label     给人看的名字
#   desc      工具描述的开头(AI 靠它判断该不该用这个工具)
#   params    参数表.每个参数:
#               type      player | item_id | int | str
#               required  必填?(**有 default 时不必写 required**)
#               default   缺省值;写了它就不算必填
#               min/max   仅 int
#               max_len   仅 str
#               desc      参数说明(进 JSON Schema,AI 看得到)
#   template  命令模板.`{参数名}` 会被替换.**不带前导斜杠**.
#             ⚠️ 占位符必须在 params 里有对应项,否则启动报错.
#   karma     定价.三选一:
#               model: none            免费
#               model: fixed           写死(还要给 cost: <整数>)
#               model: table_then_ai   表内查表;表外要 AI 按 pricing_rules 报价
#             table_then_ai 还要给:
#               table           {物品ID: 好感}
#               pricing_rules   给 AI 看的报价规则(注入工具描述)
#               table_key       用哪个参数查表(默认 item)
#   confirm   是否先发确认卡(玩家点了才执行)
#   done      完成播报模板
# ---------------------------------------------------------------------------

# ⚠️ 改动过**语义**时把这个数字 +1.插件会拿它跟落盘的旧文件比对,
#    更旧就告警(这份文件**从不覆盖**已存在的 —— 那是给人改的).
#    1 → 2:confirm 动作现在必须有 apply(展开成 check/clear/give).
#    2 → 3:give_item 不再限"纯物品"—— 支持 components(改名/附魔/属性…);
#           新增 modify_item(改玩家**已有**物品).
#    4 → 5:新增 upgrade_item(交材料 + **原地合并**升级已有装备);
#           swap_items 收敛为**纯以物换物**(它只换不并,原来被误用于升级 → 会丢附魔).
#    5 → 6:计价公式化 —— 顶层 pricing_common(L/I/R/超标三档/折扣) 全动作共用,
#           各动作 pricing_rules 只写本动作的 C 公式(用户 2026-10-14 的 mc_command 公式迁移).
version: 6

# 通用计价框架:构建工具描述时会自动拼在**每个动作自己的 pricing_rules** 之后,
# 改这一处即全局生效.表内物品由插件查表(代码强制,AI 报价忽略) —— 框架只管表外.
pricing_common: |-
  通用计价框架(先算 C,再算 T,把 T 填进 cost):
  L = 超出原版上限的等级数.附魔/效果有数值的按 max(0, 实际等级 - 原版上限) 计.
  I = 物品带无法破坏则为 1,否则为 0.
  R = 玩家当前剩余好感.不确定就先调 mc_karma(delta 传 0)查,别猜.
  超标三档:
  - 严重超标(L >= 6,或实际等级 >= 原版上限的 2 倍):本工具拒绝;
    告知只能用材料换 —— 材料仅认回响碎片/附魔金苹果/唱片/绿宝石原矿,
    数量为 L-4 或 原版上限*5,且 C = 20 + 5L + 20I,走 swap_items 或 upgrade_item.
  - 完全超标(最终数值超过 10倍L 或 原版上限的 3 倍):任何工具都拒绝,直接说明.
  - 好感不足(C > R):不执行不扣费,隐晦告知原因.
  折扣:Z = min(R * 0.1, 8).C - Z <= 5 时收 C,否则收 C - Z(把结果填进 cost).

actions:
  # -------------------------------------------------------------------------
  # 给玩家物品
  # -------------------------------------------------------------------------
  # ⚠️ 下面这段是**改造前**的说法(当时只能发纯物品、带组件的走 mc_command).
  #    2026-10-11 起 `give_item` 自己就支持 `components`(见它的 desc),
  #    "造物品"那套已由它承担;`modify_item` 负责改玩家**已有**的物品.
  # 历史(design spec §2.4):当时担心"玩家先改名→拿到物品→丢掉原物→再让 AI 改名"
  #    会凭空多一件,所以发明了独立动作做原子操作 —— 那个担忧正是
  #    `modify_item` 存在的理由.
  - name: give_item
    label: 给玩家物品
    desc: >-
      玩家要一件新的东西,且不需要交出任何东西时用这个.
      可带自定义名称/附魔/属性/说明,写进 components.
      要交材料或交旧装备才能拿到的,用 swap_items;
      要改他身上已有那件的,用 modify_item.
      ⚠️ 调用后只发一张私聊确认卡,此刻什么都没发生:没给东西,没扣好感.
      别说"已经给你了""好感已经扣了";他若问扣多少,就说点了确认才扣.
    params:
      player:
        type: player
        required: true
        desc: 接收者的游戏 ID
      item:
        type: item_id
        required: true
        desc: 物品 ID,如 diamond 或 minecraft:diamond.要带名字/附魔/属性就填 components
      count:
        type: int
        min: 1
        max: 6400
        default: 1
        desc: 数量,默认 1
      display_name:
        type: str
        required: true
        max_len: 24
        desc: >-
          这件东西在**卡片和播报里**给玩家看的名字,如"铁锭""一把钻石剑".
          ⚠️ 不是物品 ID —— 填 minecraft:iron_ingot 的话公屏上就显示这串英文.
      components:
        type: components
        required: false
        desc: >-
          物品的附加内容,**不填就是普通物品**.写法(只写方括号内部):
            改名: custom_name={text:"龙鳞",color:"gold",bold:true}
            说明: lore=[{text:"第一行",color:"red"},{text:"第二行"}]
            附魔: enchantments={"minecraft:sharpness":5,"minecraft:unbreaking":3}
            属性: attribute_modifiers=[{type:"attack_damage",amount:20,operation:"add_value",slot:"mainhand",id:"x"}]
            不可破坏: unbreakable={}
            稀有度: rarity="epic"
          多项用逗号连接,如 custom_name={text:"绝影",color:"aqua"},enchantments={"minecraft:sharpness":5}
          ⚠️ 名字/说明要带颜色或样式时**必须**写成组件对象 {text:"...",color:"..."};
             写成 '{"text":"..."}'(JSON 套引号)会**静默变成字面量**,显示一堆花括号.
          ⚠️ 组件名写在方括号里,用 = 连接;附魔名要带 minecraft: 前缀.
      cost:
        type: int
        min: 0
        required: false
        desc: >-
          按**本工具说明**里的计价规则算出 T(含折扣)后填进来;表内物品**不用填**
          (插件自动查表,报了也被忽略).
          ⚠️ 这里填的只是**报价**,玩家点"确认"之后才真的扣.
    template: "give {player} {item} {count}"
    karma:
      model: table_then_ai
      table_key: item
      table:
        minecraft:diamond: 3
        minecraft:golden_apple: 3
        minecraft:dragon_egg: 20
        minecraft:nether_star: 20
        minecraft:elytra: 20
        minecraft:netherite_ingot: 3
        minecraft:enchanted_golden_apple: 3
        minecraft:music_disc_pigstep: 3
        minecraft:ancient_debris: 5
        minecraft:heart_of_the_sea: 5
      max_cost: 60
      pricing_rules: |-
        本动作报价(物品**不在**上面的表里时才算;表内物品插件自动查表,报了也被忽略):
        表外无组件,按档位:
        1 = 原版常见易得(木,石,泥土,食物,羊毛)
        2 = 需挖掘或合成,不算稀有(铁,铜,红石,青金石,书)
        3 = 稀有或需要功夫(金,绿宝石,钻石类装备,下界合金)
        5 = 需探索或定位(海洋之心,远古残骸,回响碎片)
        7 = 结构战利品或打 Boss(鞘翅,龙蛋,下界之星,附魔金苹果)
        拿不准按 3.
        表外**带组件**且都在原版上限内:按档位再 +2~5.
        带组件且超出原版上限(附魔超上限/无法破坏):C = 10 + 5L + 20I.
    confirm: true
    # 展开成 MC 可执行的步骤(spec §10):MC 不认识动作名,只认 check/clear/give.
    # ⚠️ give_item 是"凭空给",没有 check(不消耗玩家的东西).要消耗材料的
    #    动作才需要 check —— 见 swap_items.
    apply:
      - {op: give, from: item, count_from: count, components_from: components}
    card:
      title: "确认请求"
      item_label: "获得"
      confirm_hover: "同意,扣除 {cost} 好感"
      cancel_hover: "否决,无消耗"
    # `{items}` = "⌜显示名⌝ ×数量"串(见 actions.render_done_items).
    # ⚠️ **不要用 `{item}`** —— 那给的是物品 ID(`minecraft:iron_ingot`),
    #    公屏上会显示一串英文 ID 而不是显示名.
    done: "{player} 花费 {cost} 好感获得 {items}"
  # -------------------------------------------------------------------------
  # 交换物品(材料换成品)—— **扣材料的唯一归宿**
  # -------------------------------------------------------------------------
  # 用途:玩家上交材料换一件/多件物品.服务器设定"超规格物品要消耗绿宝石
  #      原矿,回响碎片"这类材料,就靠它扣.
  #      玩家从零要新的,还是把**已有装备**升级,都由 LLM 按提示词决定 ——
  #      要升级就在 pay 里把"他原本那件装备 + 材料"一起写上.
  # ⚠️ 收走玩家装备这一步风险最高(`/item replace ... from ...` 是**复制**语义).
  #    MC 端按 steps 里的 clear 精确扣(先数后抠),规格见 spec §10.
  - name: swap_items
    label: 交换物品
    desc: >-
      涉及到交换物品,或同时提交两个及以上的物品换取其他物品时用这个.
      交出的与换回的都可以不止一种.
      ⚠️ 它**只换不并** —— 换回来的是一件**新的**,原来那件的组件**不会**自动带过来.
      要"交出材料,把他身上**已有**那件原地升级(保留原有附魔与名字)"的,用 upgrade_item;
      只改已有东西,不交材料的,用 modify_item;
      他只想要一件新东西,不交出任何东西的,用 give_item.
      ⚠️ 交出物必须真在他背包里:数量不够就整体拒绝,一件都不动,也不加好感.
      交出的东西在他身上有好几件,分不清是哪一件时,用槽位寻址说清
      (如 `weapon.mainhand=旧剑`),服务器会去读那一格真实的物品,你不用猜.
    params:
      player:
        type: player
        required: true
        desc: 玩家游戏 ID
      pay:
        type: item_list
        required: true
        desc: >-
          玩家上交的物品.格式 `物品ID*数量=显示名`,多项用 `;` 隔开.
          例:`minecraft:emerald*8=绿宝石原矿; minecraft:echo_shard*2=回响碎片`
          数量省略为 1;显示名只用于给玩家看的卡片.
          要交出的东西**带组件**时(少见,如把附魔剑当材料交出去),用 `|` 接,写法同 gain.
          **另一种写法是槽位寻址**:直接写槽位名代替物品 ID,表示"他身上那一格的东西",
          如 `weapon.mainhand=旧剑` —— 猜出来的物品与组件对不上,插件会拒绝执行.
          可用槽位:weapon.mainhand / weapon.offhand / armor.head / armor.chest /
          armor.legs / armor.feet / hotbar.0~8 / inventory.9~35.
          ⚠️ **先查再决定**:不知道他有几件,是哪一件,就调 `inspect_items` 查(只读,不消耗好感) —— **别猜,也别让他去改参数**.
      gain:
        type: item_list
        required: true
        desc: >-
          玩家获得的物品,格式同 pay.例:`minecraft:iron_ingot*3=铁锭`
          ⚠️ 这里**不能**用槽位写法 —— 槽位是"从他身上取",而这里是"给他".
          **要换回带附魔或改名的成品**时,在条目末尾用 `|` 接组件 ——
          ⚠️ 一条里 `|` **只能出现一次**(再写一个会被当成组件内容,MC 直接报错);
          要挂**多个**组件,它们之间用**逗号**连:
          `minecraft:diamond_sword*1=钻石剑|enchantments={"minecraft:sharpness":5},custom_name={text:"龙鳞",color:"gold"}`
          `|` 后面的写法与 give_item 的 components 参数**完全一样**(见那里的例子).
      cost:
        type: int
        required: false
        min: 0
        desc: 按**本工具说明**里的计价规则算出 T(含折扣)后填进来(0 = 不收).
    # 🔴 **必须有 karma 块** —— 只声明 `cost` 参数是**不够**的:
    #    `resolve_karma` 按 `karma.model` 决定要不要读它,不写这个块就等于
    #    `model: none`,AI 报的 cost 被**静默忽略**,一分好感不扣
    #    (2026-10-11 评审发现,两个动作一直如此).
    #    这里给 `table_then_ai` + **空表** = "一律用 AI 报价"——
    #    本动作连 `item` 参数都没有,不可能命中表,所以语义稳定.
    karma:
      model: table_then_ai
      max_cost: 30
      pricing_rules: |-
        本动作报价:gain 里每件物品按 give_item 的规则算(表内查表/表外按档位/
        带组件另算),全部求和即 C.
        **交出的材料不抵扣好感** —— 材料是你与玩家的交易内容,C 另收.
        严重超标的物品走这里换:C = 20 + 5L + 20I,材料仅认回响碎片/附魔金苹果/
        唱片/绿宝石原矿,**禁止**用钻石等普通物品换超标件.
    # ⚠️ 播报取 **gain**(他获得的),不是 pay(他上交的)
    done_items_from: [gain]
    template: ""
    apply:
      - {op: check, from: pay}
      - {op: clear, from: pay}
      - {op: give,  from: gain}
    card:
      title: "交换物品"
      pay_label: "上交"
      gain_label: "获得"
      confirm_hover: "同意,扣除 {cost} 好感"
      cancel_hover: "否决,无消耗"
    confirm: true
    done: "{player} 交换获得 {items}"

  # -------------------------------------------------------------------------
  # 交材料 + **原地升级已有装备**(合并组件,原有附魔保留)
  # -------------------------------------------------------------------------
  # 🔴 为什么要有它(2026-10-14 真机事故):玩家说「用一组钻石升级身上的剑」,
  #    AI 判断该用 swap_items,但 swap_items 是**只换不并**(clear 旧的 + give 新的)
  #    —— 它只要漏写一个组件,那件装备就残了。实测:原有 sharpness5/looting3/…
  #    被一次「升级」全清掉,换回来一把白板。
  #    ⇒ 升级已有装备必须走 **modify**(原地合并,没点名的组件保留)。
  #    材料收走用 clear,但**所有 check 必须排在 clear 之前**(否则材料不够会扣半截)。
  - name: upgrade_item
    label: 升级已有装备
    desc: >-
      玩家**交出材料**,把他身上**已有**那件装备原地升级(加附魔/改名/加属性)时用这个.
      东西本身不换,所在格子不变,他**没点名**的组件(原有附魔/名字/说明)一律自动保留.
      要换成一件**不一样的**东西(形状/ID 都变)的,用 swap_items;
      不需要材料或只想改一下的,用 modify_item.
      ⚠️ 材料必须真在他背包里:不够就整条拒绝,一件都不动,也不加好感.
      ⚠️ 调用后只发一张私聊确认卡,此刻什么都没发生.
    params:
      player:
        type: player
        required: true
        desc: 玩家游戏 ID
      targets:
        type: slot_list
        required: true
        desc: >-
          要升级他身上**哪一格**,格式 `槽位=卡片上显示的名字`,多个用 `;` 隔开.
          可用槽位:weapon.mainhand / weapon.offhand / armor.head / armor.chest /
          armor.legs / armor.feet / hotbar.0~8 / inventory.9~35
          ⚠️ 不知道在哪一格,先调 `inspect_items` 查(只读,不消耗好感) —— 别猜,
          也别让他去改参数.
      components:
        type: components
        required: true
        desc: >-
          **要改的那几项**,只写要改的,其余自动保留(写法与 modify_item 完全相同):
            改名: custom_name={text:"龙鳞",color:"gold"}
            说明: lore=[{text:"第一行",color:"red"}]
            附魔: enchantments={"minecraft:sharpness":7,"minecraft:mending":1}
            属性: attribute_modifiers=[{type:"attack_damage",amount:20,operation:"add_value",slot:"mainhand",id:"x"}]
          ⚠️ 多个组件用**逗号**连接(不是分号也不是竖线).
          ⚠️ **附魔是整套替换** —— 想"再加一条"就得把原有的附魔都写上,
             所以**先调 `inspect_items` 查那一格**,把原有附魔照抄进来.
      pay:
        type: item_list
        required: true
        desc: >-
          交出的**材料**,格式 `物品ID*数量=显示名`,多项用 `;` 隔开.
          例:`minecraft:diamond*64=钻石`
          ⚠️ **只写材料** —— 不要把要升级的那件写进来(那件由 `targets` 指名).
      cost:
        type: int
        required: false
        min: 0
        desc: 按**本工具说明**里的计价规则算出 T(含折扣)后填进来(0 = 不收).
    # 🔴 必须有 karma 块,否则 AI 报价被静默忽略(见 swap_items 处的说明)
    karma:
      model: table_then_ai
      max_cost: 30
      pricing_rules: |-
        本动作报价:
        改动都在原版上限内 → C = 3~5(改的项多取高).
        超出原版上限 → C = 10 + 5L + 20I.
        **交出的材料不抵扣好感** —— 材料是你与玩家的交易内容,C 另收.
        附魔是整套替换,先 inspect_items 把原有附魔照抄进来再改.
    # 播报取 **pay**(他交出的材料),不是 targets(那是要升级的装备名)
    done_items_from: [pay]
    template: ""
    # ⚠️ 步骤顺序是硬要求:**所有 check 排在 clear 之前**
    #    —— 否则材料不够时 clear 已经扣了而 modify 才失败 = 半成品.
    #    `runSteps` 的预校验也依赖这个顺序(它逐条干跑,遇到问题整体中止).
    apply:
      - {op: check,  from: pay}
      - {op: clear,  from: pay}
      - {op: modify, from: targets, components_from: components}
    card:
      title: "升级装备"
      pay_label: "上交材料"
      confirm_hover: "同意,扣除 {cost} 好感"
      cancel_hover: "否决,无消耗"
    confirm: true
    done: "{player} 花费 {cost} 好感,用 {items} 升级了装备"

  # -------------------------------------------------------------------------
  # 修改玩家**已有**物品(改名 / 附魔 / 属性 / 说明)
  # -------------------------------------------------------------------------
  # ⚠️ 与 give_item 的区别:这个是改他**身上那件**,不是发一件新的.
  #    实现上原地替换同一格(读出来 → 合并组件 → 写回),不会有复制窗口.
  # ⚠️ **不再覆盖**:2026-10-11 起是**合并** —— LLM 没点名的组件一律保留
  #    玩家原有的(Java 侧 `buildMergedItem` 用 `copyDataFrom` +
  #    `isDataOverridden`).**唯一例外是附魔**:写 `enchantments` 就是换掉整组.
  - name: modify_item
    label: 修改物品
    desc: >-
      玩家要改他身上**已有**那件的名称/说明/附魔/属性,东西本身不换时用这个.
      物品,数量,所在格子都不变,不会多出一件.
      要交材料才能给的改,用 swap_items;要一件新东西,用 give_item.
      ✅ 只写你要改的那几项就行 —— 其余组件(原有附魔/说明/名字/不可破坏)
      由服务器自动原样保留,不用你抄,你也读不到.
      ⚠️ 玩家只说"改我背包里那个"而没说第几格时,**先调 `inspect_items` 查**(只读,不消耗好感),别猜也别让他改参数
      ⚠️ 唯一例外:附魔是整套替换 —— 要"再加一条"就得把原有的都写上,所以**先调 `inspect_items` 查那一格**,把原有附魔照抄进去.
    params:
      player:
        type: player
        required: true
        desc: 玩家游戏 ID
      targets:
        type: slot_list
        required: true
        desc: >-
          要改哪几个槽位,格式 `槽位=卡片上显示的名字`,多个用 ; 隔开.
          可用槽位:weapon.mainhand / weapon.offhand /
          armor.head / armor.chest / armor.legs / armor.feet /
          hotbar.0~8 / inventory.9~35
          例:单件用 `weapon.mainhand=绝影`;
              全套装备用 `armor.head=神级头盔; armor.chest=神级胸甲; armor.legs=神级护腿; armor.feet=神级靴子`
          ⚠️ 玩家只说"改我背包里那个 x""改我的武器"而没说具体第几格时,
          **先调 `inspect_items` 查**(只读,不消耗好感),别猜,也别让他改参数 —— 他未必记得在第几格.
          查到他有**多件**同名同类的,也要按查到的**槽位**说清是哪一件.
      components:
        type: components
        required: true
        desc: >-
          要**改**的那几项组件. 没写的项一律保留玩家物品原样(见工具说明),
          所以不用把原有组件抄一遍.
          **同一批 target 共用这一套**.写法同 give_item:
            改名: custom_name={text:"龙鳞",color:"gold",bold:true}
            说明: lore=[{text:"第一行",color:"red"}]
            附魔: enchantments={"minecraft:sharpness":5,"minecraft:unbreaking":3}
            属性: attribute_modifiers=[{type:"attack_damage",amount:20,operation:"add_value",slot:"mainhand",id:"x"}]
            不可破坏: unbreakable={}
          多个组件用逗号连接.
          ⚠️ 名字带颜色时必须写组件对象 {text:"...",color:"..."},
             写成 '{"text":"..."}'(JSON 套引号)会**静默变成字面量**.
      cost:
        type: int
        required: false
        min: 0
        desc: 按**本工具说明**里的计价规则算出 T(含折扣)后填进来(0 = 不收).
    # 🔴 同上,必须有 karma 块,否则 AI 报价被静默忽略(见 swap_items 处的说明)
    karma:
      model: table_then_ai
      max_cost: 50
      pricing_rules: |-
        本动作报价:
        改动都在原版上限内 → C = 3~5(改的项多取高).
        超出原版上限 → C = 10 + 5L + 20I.
    template: ""
    # ⚠️ **不要 check** —— `targets` 是要改的槽位,不是材料.槽位是否为空,
    #    组件是否写得出来,都由 MC 端的 modify 步骤在**动手前**校验.
    apply:
      - {op: modify, from: targets, components_from: components}
    card:
      title: "修改物品"
      # 卡片两行的标签(可选,默认就是"当前 / 改成")
      # current_label: "当前"
      # modified_label: "改成"
      confirm_hover: "同意,扣除 {cost} 好感"
      cancel_hover: "否决,无消耗"
    confirm: true
    done: "{player} 花费 {cost} 好感修改了物品"

  # -------------------------------------------------------------------------
  # -------------------------------------------------------------------------
  # 传送到坐标
  # -------------------------------------------------------------------------
  # 🔴 `apply: [{op: command}]` 是**必须**的 —— `template` 与 `confirm` 共存时,
  #    若 `apply` 为空,steps 就为空,`_offer_action_confirm` 会把整条动作当成
  #    "只改好感,不动游戏"**立即结算**,命令永不执行(静默失灵).
  #    有了 `command` 这一步,模板才走得进确认卡那条路.
  - name: teleport_to
    label: 传送到坐标
    desc: >-
      玩家给出**坐标**,要传过去时用这个.
      要把人传到另一个玩家身边的,用 teleport_player_to.
      坐标支持 `~` 相对写法(`~ ~ ~` = 原地).只在当前维度内;
      跨维度用 mc_command 手写 execute in.
      ⚠️ 调用后只发一张私聊确认卡,玩家点了才传送.
    params:
      player:
        type: player
        required: true
        desc: 要传送的玩家游戏 ID
      x:
        type: coord
        required: true
        label: X
        desc: X 坐标,如 100 或 ~0
      y:
        type: coord
        required: true
        label: Y
        desc: Y 坐标,如 64 或 ~
      z:
        type: coord
        required: true
        label: Z
        desc: Z 坐标,如 200 或 ~0
      cost:
        type: int
        required: false
        min: 0
        desc: 按**本工具说明**里的计价规则算出 T(含折扣)后填进来(0 = 不收).
    karma:
      model: table_then_ai
      max_cost: 30
      pricing_rules: |-
        本动作报价:C = ceil(距离/1000) + 10W.
        距离按起终点三维直线算(相对坐标 ~ 先换算成绝对);缺起点用发起者位置.
        W = 起终点跨维度则为 1,否则为 0.
        距离 > 0 但不足 1000 按 1 计.
    # ⚠️ **同维度**传送.跨维度(主世界↔下界↔末地)用 mc_command 手写
    #    `execute in <维度> run tp ...` —— 这里不做,因为 AI **不知道玩家当前
    #    在哪个维度**(游戏侧上下文里没有这个信息),做成可空参数还会让模板
    #    残留占位符(`render_command` 会直接报错).
    template: "tp {player} {x} {y} {z}"
    apply:
      - {op: command, from: player}
    card:
      title: "确认传送"
      confirm_hover: "同意,扣除 {cost} 好感"
      cancel_hover: "否决,无消耗"
    confirm: true
    done: "{player} 被传送到了 {x} {y} {z}"

  # -------------------------------------------------------------------------
  # 把玩家传送到另一个玩家身边
  # -------------------------------------------------------------------------
  - name: teleport_player_to
    label: 传送到玩家
    desc: >-
      玩家要把某人传到**另一个玩家身边**时用这个.
      传一组坐标用 teleport_to.
      ⚠️ 调用后只发一张私聊确认卡,玩家点了才传送.
    params:
      player:
        type: player
        required: true
        desc: 要被传送的玩家游戏 ID
      target:
        type: player
        required: true
        label: 目标玩家
        desc: 目标玩家游戏 ID(传到他身边)
      cost:
        type: int
        required: false
        min: 0
        desc: 按**本工具说明**里的计价规则算出 T(含折扣)后填进来(0 = 不收).
    karma:
      model: table_then_ai
      max_cost: 30
      pricing_rules: |-
        本动作报价:把发起者**自己**传到别人身边 → C = 0;
        把**别人**传送(无论去哪)→ C = 1.
    template: "tp {player} {target}"
    apply:
      - {op: command, from: player}
    card:
      title: "确认传送"
      confirm_hover: "同意,扣除 {cost} 好感"
      cancel_hover: "否决,无消耗"
    confirm: true
    done: "{player} 被传送到了 {target} 身边"

  # 收下礼物(玩家送了有价值的东西)
  # -------------------------------------------------------------------------
  # ⚠️ 与 give_item 的区别:**方向相反** —— 是玩家给 AI,不是 AI 给玩家.
  # ⚠️ 物品必须真在他背包里:`apply` 里的 check 先核验,不够就整体拒绝,不加好感.
  #    这一步也是防"口头说说就加好感"的技术兜底(提示词那一层管不了谎报).
  - name: offer_karma
    label: 收下礼物
    desc: >-
      玩家**送给你**东西,且那东西有价值时,收下并加 1~2 点好感.
      什么算有价值见系统提示词里的礼物规则;没价值或能量产的,用 refuse_gift.
      ⚠️ 东西必须真在他背包里:插件先核验再收走,核验不过直接失败,不会加好感
         —— 所以光嘴上说"我送你了"加不到好感.
      ⚠️ 调用后只发一张私聊确认卡,此刻什么都没发生(东西没拿走,好感没加).
    params:
      player:
        type: player
        required: true
        desc: 玩家游戏 ID
      item:
        type: item_id
        required: true
        desc: >-
          物品 ID,如 diamond 或 minecraft:diamond.
          ⚠️ 玩家没说清是什么,或只说"我手上这个""这个给你"时,
          **先调 `inspect_items` 查**(只读,不消耗好感),别瞎填一个 id,也别让他去查自己.查出来再填这里.
      count:
        type: int
        min: 1
        max: 6400
        default: 1
        desc: 数量,默认 1
      display_name:
        type: str
        required: true
        max_len: 24
        desc: 这个物品的名字,卡片与播报里给玩家看,如"钻石".就是它显示在方括号里的那个名字
      delta:
        type: int
        required: true
        min: 1
        max: 2
        desc: 加多少好感,只能 1 或 2
    template: ""
    apply:
      - {op: check, from: item, count_from: count}
      - {op: clear, from: item, count_from: count}
    # 好感**加** delta(不是扣 cost)—— 见 actions.resolve_karma_delta
    karma: {model: param, param: delta}
    card:
      title: "确认提交物品"
      item_label: "提交物品"
      confirm_hover: "同意"
      cancel_hover: "不用了"
    confirm: true
    done: "{player} 送出 {items},好感 +{delta}"

  # -------------------------------------------------------------------------
  # 拒收礼物(送的东西无价值 / 可量产)
  # -------------------------------------------------------------------------
  # ⚠️ **不拿走他的物品**(所以才没有 clear).`apply` 是空的.
  # ⚠️ **不发确认卡** —— AI 决定拒收就该直接拒,让玩家点一下"确认"很奇怪.
  - name: refuse_gift
    label: 拒收礼物
    desc: >-
      玩家送的东西没价值或能量产,不收,按情况扣一点好感.
      **不拿走他的物品** —— 东西还在他背包里.
      delta:无价值的 -1 或 -2;能量产的 0.
      送的东西有价值的,用 offer_karma.
      ⚠️ 调用后没有确认卡,立刻生效 —— 你调用完就可以直接回话了.
    params:
      player:
        type: player
        required: true
        desc: 玩家游戏 ID
      display_name:
        type: str
        required: true
        max_len: 24
        desc: 他送的那个东西的名字,播报里给玩家看,如"石头"
      delta:
        type: int
        required: true
        min: -2
        max: 0
        desc: 好感变化,只能 -2 / -1 / 0
      reason:
        type: str
        required: false
        max_len: 60
        desc: 一句话理由,会**私聊**转达给玩家(不公屏)
    template: ""
    apply: []
    karma: {model: param, param: delta}
    confirm: false
    # 播报取 display_name 那侧(这个动作没有物品参数)
    done_items_from: []
    done: "{player} 送出 ⌜{display_name}⌝,被拒收了"
